<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置 - Desktop Pet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 20px 24px 24px;
      user-select: none;
      -webkit-user-select: none;
      overflow-y: auto;
    }
    h2 {
      font-size: 15px;
      color: #fff;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .section-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 20px 0 16px;
    }
    .section {
      margin-bottom: 12px;
    }
    .section label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
    }
    .section input, .section select {
      width: 100%;
      padding: 7px 10px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .section input:focus, .section select:focus {
      border-color: rgba(100,150,255,0.5);
    }
    .section input[type="password"] {
      font-family: monospace;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .btn-row button {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-save {
      background: rgba(100,150,255,0.3);
      color: #d0d8ff;
    }
    .btn-save:hover { background: rgba(100,150,255,0.5); }
    .btn-close {
      background: rgba(255,255,255,0.06);
      color: #999;
    }
    .btn-close:hover { background: rgba(255,255,255,0.12); }
    .status-msg {
      margin-top: 12px;
      font-size: 12px;
      color: #4a4;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <!-- ── LLM 配置 ── -->
  <h2>对话模型设置</h2>

  <div class="section">
    <label>宠物名字</label>
    <input type="text" id="petName" placeholder="喵喵" />
  </div>
  <div class="section">
    <label>API 地址</label>
    <input type="text" id="endpoint" placeholder="https://api.openai.com/v1/chat/completions" />
  </div>
  <div class="section">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-..." />
  </div>
  <div class="section">
    <label>模型</label>
    <input type="text" id="model" placeholder="gpt-3.5-turbo" />
  </div>
  <div class="section">
    <label>Temperature</label>
    <input type="text" id="temperature" placeholder="0.8" />
  </div>
  <div class="section">
    <label>协议</label>
    <select id="protocol">
      <option value="openai">OpenAI 兼容</option>
      <option value="anthropic">Anthropic 兼容</option>
    </select>
  </div>
  <div class="section">
    <label>人设</label>
    <select id="persona"></select>
  </div>

  <!-- ── TTS 配置 ── -->
  <hr class="section-divider" />
  <h2>语音合成设置（TTS）</h2>

  <div class="section">
    <label>TTS API 地址</label>
    <input type="text" id="ttsEndpoint" placeholder="https://api.xiaomimimo.com/v1/chat/completions" />
  </div>
  <div class="section">
    <label>TTS API Key</label>
    <input type="password" id="ttsApiKey" placeholder="留空则不启用语音合成" />
  </div>
  <div class="section">
    <label>模型</label>
    <input type="text" id="ttsModel" placeholder="mimo-v2.5-tts-voicedesign" />
  </div>
  <div class="section">
    <label>音色描述</label>
    <input type="text" id="ttsVoice" placeholder="16 岁少女感的可爱萝莉音，音色清亮甜美，声音轻盈、有亲近感" />
  </div>
  <div class="section">
    <label>演绎风格</label>
    <input type="text" id="ttsStyle" placeholder="语速偏轻快，情绪自然灵动，尾音柔和上扬，表达可爱但不过度夸张" />
  </div>

  <!-- ── 桌宠 / 行为设置 ── -->
  <hr class="section-divider" />
  <h2>桌宠设置</h2>

  <div class="section">
    <label>窗口缩放 <span id="scaleVal" style="color:#8be9fd">100%</span></label>
    <input type="range" id="scale" min="0.6" max="1.8" step="0.05" value="1" />
  </div>
  <div class="section">
    <label>不透明度 <span id="opacityVal" style="color:#8be9fd">100%</span></label>
    <input type="range" id="opacity" min="0.3" max="1" step="0.05" value="1" />
  </div>
  <div class="section">
    <label>语音音量 <span id="volumeVal" style="color:#8be9fd">100%</span></label>
    <input type="range" id="volume" min="0" max="1" step="0.05" value="1" />
  </div>
  <div class="section" style="display:flex;align-items:center;gap:8px">
    <input type="checkbox" id="alwaysOnTop" style="width:auto" />
    <label for="alwaysOnTop" style="margin:0">窗口置顶</label>
  </div>
  <div class="section" style="display:flex;align-items:center;gap:8px">
    <input type="checkbox" id="enableMovement" style="width:auto" />
    <label for="enableMovement" style="margin:0">允许自主走动</label>
  </div>
  <div class="section" style="display:flex;align-items:center;gap:8px">
    <input type="checkbox" id="enableDataCalc" style="width:auto" />
    <label for="enableDataCalc" style="margin:0">启用数据计算（需求消耗）</label>
  </div>

  <div class="btn-row">
    <button class="btn-save" id="btn-save">保存</button>
    <button class="btn-close" id="btn-close">关闭</button>
  </div>
  <div class="status-msg" id="status-msg"></div>

  <script src="scripts/runtime.js"></script>
  <script src="scripts/settings.js"></script>
</body>
</html>
