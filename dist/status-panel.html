<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宠物状态</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: "Microsoft YaHei", -apple-system, sans-serif;
      font-size: 13px;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 标签栏 */
    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.25);
      flex-shrink: 0;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      font-size: 12px;
      color: #999;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab:hover { color: #ccc; }
    .tab.active { color: #fff; border-bottom-color: #818cf8; }

    .view {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 18px;
    }
    .view[hidden] { display: none; }

    /* 顶部：名字 + 等级 + 金币 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .header-name { font-size: 15px; font-weight: bold; color: #fff; }
    .header-money { font-size: 12px; color: #ffd700; }

    /* 心情状态卡 */
    .mood-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      border: 1px solid transparent;
    }
    .mood-emoji { font-size: 24px; line-height: 1; }
    .mood-text { flex: 1; }
    .mood-label { font-size: 14px; font-weight: bold; line-height: 1.2; }
    .mood-sub { font-size: 10px; color: #888; margin-top: 3px; }
    .mood-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    /* 经验条 */
    .section-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 11px;
      color: #888;
    }
    .exp-val { color: #a78bfa; }
    .bar-wrap { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }

    /* 属性行 */
    .stat-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .stat-row { display: flex; align-items: center; gap: 8px; }
    .stat-name { width: 30px; font-size: 11px; color: #aaa; flex-shrink: 0; }
    .stat-bar-wrap { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
    .stat-pct { width: 32px; text-align: right; font-size: 11px; flex-shrink: 0; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 11px;
      color: #888;
    }
    .info-val { color: #ccc; }
    .info-val.pink { color: #f9a8d4; font-weight: bold; }

    /* 统计 */
    .stat-group-title { font-size: 12px; color: #ffcf8a; margin: 12px 0 6px; font-weight: bold; }
    .stat-group-title:first-child { margin-top: 0; }
    .kv-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
    .kv-row .k { color: #aaa; }
    .kv-row .v { color: #e6e6e6; font-weight: 600; }

    /* 背包 */
    .inv-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; margin: 4px 0; border-radius: 8px;
      background: rgba(255,255,255,0.05);
    }
    .inv-info { flex: 1; min-width: 0; }
    .inv-name { font-size: 13px; color: #fff; font-weight: 600; }
    .inv-eff { font-size: 10px; color: #9aa0aa; margin-top: 3px; }
    .inv-count { font-size: 11px; color: #8be9fd; flex-shrink: 0; }
    .inv-use {
      border: 0; background: rgba(129,140,248,0.3); color: #d7dbff;
      border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
      font-family: inherit; flex-shrink: 0;
    }
    .inv-use:hover { background: rgba(129,140,248,0.5); }

    /* 日志 */
    .log-item { padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; line-height: 1.4; }
    .log-time { font-size: 10px; color: #777; margin-right: 6px; }
    .log-kind { font-size: 10px; color: #ffcf8a; margin-right: 6px; }
    .log-text { color: #ddd; }

    /* 邮件 */
    .mail-badge {
      display: inline-block; min-width: 15px; height: 15px; line-height: 15px;
      padding: 0 4px; margin-left: 4px; border-radius: 8px;
      background: #f87171; color: #fff; font-size: 9px; vertical-align: top;
    }
    .mail-item {
      padding: 9px 11px; margin: 6px 0; border-radius: 8px;
      background: rgba(255,255,255,0.05); border-left: 3px solid #818cf8;
    }
    .mail-item.opened { opacity: 0.55; border-left-color: #555; }
    .mail-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .mail-title { font-size: 13px; color: #fff; font-weight: 600; }
    .mail-time { font-size: 10px; color: #777; flex-shrink: 0; }
    .mail-body { font-size: 11px; color: #bbb; margin: 5px 0 6px; line-height: 1.45; }
    .mail-reward { font-size: 11px; color: #ffd700; }
    .mail-open {
      border: 0; background: rgba(129,140,248,0.35); color: #e3e6ff;
      border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
      font-family: inherit; margin-top: 6px;
    }
    .mail-open:hover { background: rgba(129,140,248,0.55); }
    .mail-open:disabled { background: rgba(255,255,255,0.08); color: #777; cursor: default; }

    .loading { text-align: center; padding: 40px 0; color: #555; font-size: 12px; }
    .error-msg { text-align: center; padding: 40px 0; color: #f87171; font-size: 12px; }
    .empty { text-align: center; padding: 40px 0; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-tab="status">状态</div>
    <div class="tab" data-tab="stats">统计</div>
    <div class="tab" data-tab="inventory">背包</div>
    <div class="tab" data-tab="mail">邮件<span id="mail-badge" class="mail-badge" hidden></span></div>
    <div class="tab" data-tab="log">日志</div>
  </div>

  <div class="view" id="view-status"><div class="loading">加载中…</div></div>
  <div class="view" id="view-stats" hidden><div class="loading">加载中…</div></div>
  <div class="view" id="view-inventory" hidden><div class="loading">加载中…</div></div>
  <div class="view" id="view-mail" hidden><div class="loading">加载中…</div></div>
  <div class="view" id="view-log" hidden><div class="loading">加载中…</div></div>

  <script src="scripts/runtime.js"></script>
  <script>
    const { invoke } = window.PetRuntime;

    const MOOD_ICONS   = { happy: '😊', normal: '😐', poorCondition: '😟', ill: '🤒' };
    const MOOD_LABELS  = { happy: '开心', normal: '普通', poorCondition: '状态不佳', ill: '生病中' };
    const MOOD_COLORS  = { happy: '#4ade80', normal: '#94a3b8', poorCondition: '#facc15', ill: '#f87171' };
    const MOOD_BGS     = {
      happy:        'rgba(74,222,128,0.12)',
      normal:       'rgba(148,163,184,0.12)',
      poorCondition:'rgba(250,204,21,0.12)',
      ill:          'rgba(248,113,113,0.14)',
    };

    function statColor(pct) { return pct > 60 ? '#4ade80' : pct > 30 ? '#facc15' : '#f87171'; }

    function statRow(label, val) {
      const pct = Math.max(0, Math.min(100, Math.round(val)));
      const c   = statColor(pct);
      return `<div class="stat-row">
        <span class="stat-name">${label}</span>
        <div class="stat-bar-wrap"><div class="stat-bar-fill" style="width:${pct}%;background:${c}"></div></div>
        <span class="stat-pct" style="color:${c}">${pct}%</span>
      </div>`;
    }

    function fmtDuration(secs) {
      const s = Math.max(0, Math.floor(Number(secs) || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      if (h > 0) return `${h} 小时 ${m} 分`;
      if (m > 0) return `${m} 分 ${s % 60} 秒`;
      return `${s} 秒`;
    }

    function kv(k, v) { return `<div class="kv-row"><span class="k">${k}</span><span class="v">${v}</span></div>`; }

    async function loadStatus() {
      try {
        const [status, config] = await Promise.all([
          invoke('get_pet_status', {}),
          invoke('load_llm_config', {}).catch(() => null),
        ]);
        const s = status.stats;
        const mood = status.mood || 'normal';
        const petName = config?.pet_name || '小橘';
        const moodColor = MOOD_COLORS[mood] || '#94a3b8';

        const lv = s.level;
        const expFloor = Math.pow((lv - 1) * 10, 2);
        const expCeil = Math.pow(lv * 10, 2);
        const expInLevel = Math.round(s.exp - expFloor);
        const expToNext = expCeil - expFloor;
        const expPct = Math.min(100, Math.round(expInLevel / expToNext * 100));

        document.getElementById('view-status').innerHTML = `
          <div class="header">
            <span class="header-name">${petName}  &nbsp;<span style="font-size:12px;color:#94a3b8;font-weight:normal">Lv.${lv}</span></span>
            <span class="header-money">💰 ${s.money.toFixed(0)} 金币</span>
          </div>
          <div class="mood-card" style="background:${MOOD_BGS[mood]};border-color:${moodColor}44">
            <span class="mood-emoji">${MOOD_ICONS[mood] || '😐'}</span>
            <div class="mood-text">
              <div class="mood-label" style="color:${moodColor}">${MOOD_LABELS[mood] || mood}</div>
              <div class="mood-sub">当前心情状态</div>
            </div>
            <div class="mood-dot" style="background:${moodColor};box-shadow:0 0 8px ${moodColor}"></div>
          </div>
          <div class="section-label"><span>经验值</span><span class="exp-val">${expInLevel} / ${expToNext}</span></div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${expPct}%;background:#818cf8"></div></div>
          <div class="stat-list">
            ${statRow('体力', s.energy)}
            ${statRow('心情', s.happiness)}
            ${statRow('饱腹', s.hunger)}
            ${statRow('口渴', s.thirst)}
            ${statRow('健康', s.health)}
          </div>
          <div class="section-label"><span>好感度 · ${s.likabilityTitle || ''}</span><span class="info-val pink">${Math.round(s.likability ?? 0)} / ${Math.round(s.likabilityMax ?? 100)} ❤</span></div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.min(100, Math.round((s.likability ?? 0) / (s.likabilityMax || 100) * 100))}%;background:#f9a8d4"></div></div>
          ${s.like520Unlocked ? '<div class="info-row"><span>专属解锁</span><span class="info-val" style="color:#f9a8d4">💞 挚爱待机 已解锁</span></div>' : '<div class="info-row"><span>专属解锁</span><span class="info-val" style="color:#777">好感度满 520 解锁挚爱待机</span></div>'}
        `;
      } catch (e) {
        document.getElementById('view-status').innerHTML = '<div class="error-msg">加载失败</div>';
      }
    }

    async function loadStats() {
      try {
        const [s, status] = await Promise.all([
          invoke('get_statistics', {}),
          invoke('get_pet_status', {}).catch(() => null),
        ]);
        const curMoney = Number(status?.stats?.money ?? 0);
        const earned = Number(s.money_earned || 0);
        const spent = Number(s.money_spent || 0);
        document.getElementById('view-stats').innerHTML = `
          <div class="stat-group-title">钱包</div>
          ${kv('当前余额', curMoney.toFixed(0) + ' 金币')}
          ${kv('累计赚取', earned.toFixed(0) + ' 金币')}
          ${kv('累计消费', spent.toFixed(0) + ' 金币')}
          ${kv('净收益', (earned - spent).toFixed(0) + ' 金币')}
          <div class="stat-group-title">时长</div>
          ${kv('总在线', fmtDuration(s.total_online_secs))}
          ${kv('工作', fmtDuration(s.work_secs))}
          ${kv('学习', fmtDuration(s.study_secs))}
          ${kv('玩耍', fmtDuration(s.play_secs))}
          ${kv('睡眠', fmtDuration(s.sleep_secs))}
          ${kv('发呆', fmtDuration(s.idle_secs))}
          <div class="stat-group-title">互动</div>
          ${kv('摸头', s.touch_head_count)}
          ${kv('摸身体', s.touch_body_count)}
          ${kv('戳脸', s.pinch_count)}
          ${kv('拖拽', s.drag_count)}
          ${kv('跳舞', s.dance_count)}
          ${kv('说话', s.talk_count)}
          ${kv('喂食', s.feed_count)}
          ${kv('喝水', s.drink_count)}
          ${kv('送礼', s.gift_count)}
          <div class="stat-group-title">成长</div>
          ${kv('完成工作', s.work_done_count + ' 次')}
          ${kv('升级', s.level_up_count + ' 次')}
          ${kv('移动距离', Math.round(s.move_distance || 0) + ' px')}
        `;
      } catch (e) {
        document.getElementById('view-stats').innerHTML = '<div class="error-msg">加载失败</div>';
      }
    }

    async function loadInventory() {
      const el = document.getElementById('view-inventory');
      try {
        const data = await invoke('get_inventory', {});
        const items = (data && data.items) ? data.items : [];
        if (!items.length) { el.innerHTML = '<div class="empty">背包是空的，去商店逛逛吧~</div>'; return; }
        el.innerHTML = '';
        items.forEach(it => {
          const row = document.createElement('div');
          row.className = 'inv-item';
          const parts = [];
          if (it.strengthFood) parts.push(`饱腹+${it.strengthFood}`);
          if (it.strengthDrink) parts.push(`口渴+${it.strengthDrink}`);
          if (it.feeling) parts.push(`心情+${it.feeling}`);
          if (it.likability) parts.push(`好感+${it.likability}`);
          if (it.health) parts.push(`健康+${it.health}`);
          const eff = it.graph === 'gift' ? '礼物 · ' + (parts.join(' ') || '增进好感') : (parts.join(' ') || '无属性');
          row.innerHTML = `
            <div class="inv-info">
              <div class="inv-name">${it.name} <span class="inv-count">×${it.count}</span></div>
              <div class="inv-eff">${eff}</div>
            </div>`;
          const btn = document.createElement('button');
          btn.className = 'inv-use';
          btn.textContent = it.graph === 'gift' ? '赠送' : '使用';
          btn.addEventListener('click', () => {
            window.PetRuntime.emit('inventory-use', { name: it.name }).catch(() => {});
            setTimeout(loadInventory, 600);
          });
          row.appendChild(btn);
          el.appendChild(row);
        });
      } catch (e) {
        el.innerHTML = '<div class="error-msg">加载失败</div>';
      }
    }

    async function refreshMailBadge() {
      try {
        const data = await invoke('get_mailbox', {});
        const badge = document.getElementById('mail-badge');
        const n = Number(data?.unread || 0);
        if (badge) {
          badge.hidden = n <= 0;
          badge.textContent = n > 99 ? '99+' : String(n);
        }
        return data;
      } catch (_) { return null; }
    }

    async function loadMail() {
      const el = document.getElementById('view-mail');
      try {
        const data = await refreshMailBadge();
        const items = (data && data.items) ? data.items : [];
        if (!items.length) { el.innerHTML = '<div class="empty">邮箱空空如也，每天登录会收到礼包哦~</div>'; return; }
        el.innerHTML = '';
        items.forEach(m => {
          const d = new Date((m.ts || 0) * 1000);
          const hh = String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
          const rewardParts = [];
          if (m.rewardMoney > 0) rewardParts.push(`💰 ${Math.round(m.rewardMoney)} 金币`);
          (m.rewardItems || []).forEach(it => rewardParts.push(`🎁 ${it.name}×${it.count}`));
          const row = document.createElement('div');
          row.className = 'mail-item' + (m.opened ? ' opened' : '');
          row.innerHTML = `
            <div class="mail-top">
              <span class="mail-title">${m.title}</span>
              <span class="mail-time">${hh}</span>
            </div>
            <div class="mail-body">${m.body}</div>
            <div class="mail-reward">${rewardParts.join('  ')}</div>`;
          const btn = document.createElement('button');
          btn.className = 'mail-open';
          btn.textContent = m.opened ? '已领取' : '领取奖励';
          btn.disabled = !!m.opened;
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            try {
              const r = await invoke('open_mail', { id: m.id });
              if (r && r.ok) { btn.textContent = '已领取'; }
              else { btn.disabled = false; }
            } catch (_) { btn.disabled = false; }
            setTimeout(loadMail, 300);
          });
          row.appendChild(btn);
          el.appendChild(row);
        });
      } catch (e) {
        el.innerHTML = '<div class="error-msg">加载失败</div>';
      }
    }

    async function loadLog() {
      const el = document.getElementById('view-log');
      try {
        const log = await invoke('get_activity_log', { limit: 80 });
        if (!log || !log.length) { el.innerHTML = '<div class="empty">还没有活动记录</div>'; return; }
        el.innerHTML = '';
        const KIND_LABELS = { work: '工作', study: '学习', play: '玩耍', schedule: '日程', shop: '商店', inventory: '背包', level: '升级', sleep: '睡眠', system: '系统' };
        log.forEach(e => {
          const d = new Date((e.ts || 0) * 1000);
          const hh = String(d.getHours()).padStart(2, '0');
          const mm = String(d.getMinutes()).padStart(2, '0');
          const item = document.createElement('div');
          item.className = 'log-item';
          item.innerHTML = `<span class="log-time">${hh}:${mm}</span><span class="log-kind">[${KIND_LABELS[e.kind] || e.kind}]</span><span class="log-text">${e.text}</span>`;
          el.appendChild(item);
        });
      } catch (e) {
        el.innerHTML = '<div class="error-msg">加载失败</div>';
      }
    }

    const LOADERS = { status: loadStatus, stats: loadStats, inventory: loadInventory, mail: loadMail, log: loadLog };
    let currentTab = 'status';

    function switchTab(name) {
      currentTab = name;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
      document.querySelectorAll('.view').forEach(v => { v.hidden = v.id !== 'view-' + name; });
      (LOADERS[name] || loadStatus)();
    }

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => switchTab(t.dataset.tab));
    });

    // 由 Rust open_status_panel 调用
    function load() { switchTab(currentTab); refreshMailBadge(); }

    load();
  </script>
</body>
</html>
