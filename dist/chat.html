<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>和小橘聊天</title>
  <style>
    :root {
      --bg: #fffaf1;
      --panel: rgba(255, 252, 244, 0.9);
      --panel-strong: #fff;
      --ink: #3b2b1e;
      --muted: #8f6f4f;
      --line: rgba(148, 105, 55, 0.16);
      --pet: #fff1cb;
      --pet-ink: #6a3d0c;
      --user: #edf5ea;
      --user-ink: #315b3d;
      --accent: #d9922e;
      --accent-2: #f5ca66;
      --accent-3: #8fbf75;
      --shadow: 0 18px 42px rgba(109, 77, 32, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 13px;
      background:
        radial-gradient(circle at 18% 4%, rgba(245, 202, 102, 0.42), transparent 30%),
        radial-gradient(circle at 100% 12%, rgba(143, 191, 117, 0.26), transparent 34%),
        linear-gradient(180deg, #fffaf1 0%, #fff6df 44%, #f7fbef 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        radial-gradient(circle, rgba(106, 61, 12, 0.18) 1px, transparent 1.5px);
      background-size: 18px 18px;
      mask-image: linear-gradient(to bottom, #000, transparent 62%);
    }

    #chat-shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }

    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 70px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(255, 246, 222, 0.84)),
        linear-gradient(135deg, rgba(217, 146, 46, 0.18), rgba(143, 191, 117, 0.12));
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .pet-profile {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
    }

    .avatar-wrap {
      position: relative;
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(145deg, #fff4d6, #f6d99a);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 10px 24px rgba(217, 146, 46, 0.26);
      flex-shrink: 0;
    }

    .avatar-wrap::after {
      content: "";
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 11px;
      height: 11px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #71d58b;
    }

    .pet-avatar {
      width: 58px;
      height: 58px;
      object-fit: contain;
      object-position: center;
      transform: translateY(5px) scale(1.18);
      filter: drop-shadow(0 5px 8px rgba(106, 61, 12, 0.18));
    }

    .title-group {
      min-width: 0;
    }

    #chat-title {
      overflow: hidden;
      color: #46331d;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #71d58b;
      box-shadow: 0 0 0 4px rgba(113, 213, 139, 0.18);
    }

    #header-chip {
      align-self: flex-start;
      padding: 5px 9px;
      border: 1px solid rgba(217, 146, 46, 0.2);
      border-radius: 999px;
      color: #83500e;
      background: rgba(255, 248, 232, 0.78);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    #chat-messages {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      padding: 4px 2px 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(217, 146, 46, 0.52) transparent;
    }

    #chat-messages::-webkit-scrollbar {
      width: 7px;
    }

    #chat-messages::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(217, 146, 46, 0.42);
    }

    .msg-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: end;
      gap: 7px;
      animation: rise-in 180ms ease-out both;
    }

    .msg-row.user {
      grid-template-columns: minmax(0, 1fr) 28px;
    }

    .avatar-ico {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.72);
      overflow: hidden;
      box-shadow: 0 7px 18px rgba(109, 77, 32, 0.12);
      color: #5e3d17;
      font-size: 12px;
      font-weight: 800;
    }

    .avatar-ico.pet {
      background: linear-gradient(145deg, #fff4d6, #f7d389);
    }

    .avatar-ico .pet-mini-avatar {
      width: 36px;
      height: 36px;
      object-fit: contain;
      transform: translateY(4px) scale(1.18);
      filter: drop-shadow(0 4px 5px rgba(106, 61, 12, 0.15));
    }

    .msg-row.user .avatar-ico {
      grid-column: 2;
      background: rgba(237, 245, 234, 0.9);
    }

    .bubble {
      position: relative;
      width: fit-content;
      max-width: min(78%, 282px);
      padding: 9px 12px 10px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 16px;
      box-shadow: 0 8px 22px rgba(109, 77, 32, 0.12);
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bubble.pet {
      border-bottom-left-radius: 6px;
      color: var(--pet-ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.6), transparent),
        var(--pet);
    }

    .bubble.user {
      justify-self: end;
      border-bottom-right-radius: 6px;
      color: var(--user-ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.7), transparent),
        var(--user);
    }

    .bubble.streaming::after {
      content: "";
      display: inline-block;
      width: 6px;
      height: 13px;
      margin-left: 2px;
      border-radius: 2px;
      vertical-align: -2px;
      background: rgba(106, 61, 12, 0.38);
      animation: blink 0.9s steps(1) infinite;
    }

    #thinking {
      display: none;
      align-items: center;
      gap: 7px;
      min-height: 24px;
      padding: 0 4px;
      color: var(--muted);
      font-size: 12px;
      flex-shrink: 0;
    }

    #thinking.active {
      display: flex;
    }

    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 12px;
    }

    .typing-dots i {
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: dot-bounce 1.1s ease-in-out infinite;
    }

    .typing-dots i:nth-child(2) {
      animation-delay: 0.14s;
    }

    .typing-dots i:nth-child(3) {
      animation-delay: 0.28s;
    }

    #input-card {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 18px;
      background: rgba(255, 252, 244, 0.86);
      box-shadow: 0 16px 36px rgba(109, 77, 32, 0.13);
      flex-shrink: 0;
    }

    #input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #msg-input {
      flex: 1;
      min-width: 0;
      height: 38px;
      padding: 0 13px;
      border: 1px solid rgba(148, 105, 55, 0.16);
      border-radius: 14px;
      outline: none;
      color: var(--ink);
      background: rgba(255, 251, 242, 0.92);
      font-family: inherit;
      font-size: 13px;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    #msg-input::placeholder {
      color: rgba(143, 111, 79, 0.72);
    }

    #msg-input:focus {
      border-color: rgba(217, 146, 46, 0.78);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(217, 146, 46, 0.14);
    }

    #msg-input:disabled {
      opacity: 0.7;
    }

    #send-btn {
      display: grid;
      width: 40px;
      height: 38px;
      place-items: center;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #f1b34d);
      box-shadow: 0 10px 22px rgba(217, 146, 46, 0.3);
      cursor: pointer;
      font-size: 16px;
      transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
    }

    #send-btn:hover:not(:disabled) {
      filter: saturate(1.08) brightness(1.02);
      transform: translateY(-1px);
    }

    #send-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    #send-btn:disabled {
      cursor: default;
      opacity: 0.48;
      box-shadow: none;
    }

    #status-bar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      color: rgba(143, 111, 79, 0.78);
      font-size: 11px;
      line-height: 1.2;
    }

    #status-bar span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(5px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes dot-bounce {
      0%,
      70%,
      100% {
        transform: translateY(0);
        opacity: 0.45;
      }
      35% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @media (max-width: 340px) {
      #chat-shell {
        padding: 9px;
      }

      #header-chip {
        display: none;
      }

      .bubble {
        max-width: 82%;
      }
    }
  </style>
</head>
<body>
  <main id="chat-shell">
    <header id="chat-header">
      <div class="pet-profile">
        <div class="avatar-wrap"><img id="pet-avatar" class="pet-avatar" alt="宠物头像" /></div>
        <div class="title-group">
          <div id="chat-title">和小橘聊天</div>
          <div class="subtitle"><span class="status-dot"></span><span id="chat-subtitle">在线陪伴中</span></div>
        </div>
      </div>
      <div id="header-chip">桌宠对话</div>
    </header>

    <section id="chat-messages" aria-live="polite"></section>

    <div id="thinking" aria-live="polite">
      <span id="thinking-name">小橘</span><span>正在组织语言</span>
      <span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>

    <footer id="input-card">
      <div id="input-row">
        <input id="msg-input" type="text" placeholder="和她说点什么..." autocomplete="off" maxlength="500" />
        <button id="send-btn" type="button" title="发送" aria-label="发送">➤</button>
      </div>
      <div id="status-bar">
        <span id="status-text">准备好了</span>
        <span>Enter 发送</span>
      </div>
    </footer>
  </main>

  <script src="scripts/runtime.js"></script>
  <script>
    const { invoke } = window.PetRuntime;
    const msgs = document.getElementById('chat-messages');
    const input = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const thinking = document.getElementById('thinking');
    const statusText = document.getElementById('status-text');
    const title = document.getElementById('chat-title');
    const subtitle = document.getElementById('chat-subtitle');
    const thinkingName = document.getElementById('thinking-name');
    const headerAvatar = document.getElementById('pet-avatar');

    let history = [];
    let isSending = false;
    let petName = '小橘';
    let petAvatarSrc = '';

    async function loadPetAvatar() {
      const framePath = 'Default/Nomal/1/_000_250.png';
      try {
        const base64 = await invoke('read_png_frame', { framePath });
        if (!base64) return;
        petAvatarSrc = `data:image/png;base64,${base64}`;
        headerAvatar.src = petAvatarSrc;
      } catch (_) {
        headerAvatar.removeAttribute('src');
        headerAvatar.alt = '宠物头像加载失败';
      }
    }

    async function initChat() {
      try {
        const config = await invoke('load_llm_config', {});
        if (config && config.pet_name) petName = config.pet_name;
      } catch (_) {}

      document.title = `和${petName}聊天`;
      try {
        await window.PetRuntime.currentWindow().setTitle(`和${petName}聊天`);
      } catch (_) {}

      title.textContent = `和${petName}聊天`;
      thinkingName.textContent = petName;
      subtitle.textContent = '在线陪伴中';
      await loadPetAvatar();
      addBubble('pet', `喵呜，主人你好呀。今天想和${petName}聊什么呢？`);
      statusText.textContent = '准备好了';
      input.focus();
    }

    function setSending(next, label) {
      isSending = next;
      sendBtn.disabled = next;
      input.disabled = next;
      thinking.classList.toggle('active', next);
      statusText.textContent = label || (next ? '等待回复中' : '准备好了');
      if (!next) setTimeout(() => input.focus(), 0);
    }

    function addBubble(role, text, options = {}) {
      const row = document.createElement('div');
      row.className = `msg-row ${role === 'user' ? 'user' : 'pet'}`;

      const avatarIco = document.createElement('span');
      avatarIco.className = `avatar-ico ${role === 'user' ? 'user' : 'pet'}`;
      if (role === 'user') {
        avatarIco.textContent = '你';
      } else if (petAvatarSrc) {
        const mini = document.createElement('img');
        mini.className = 'pet-mini-avatar';
        mini.alt = '宠物头像';
        mini.src = petAvatarSrc;
        avatarIco.appendChild(mini);
      } else {
        avatarIco.textContent = '宠';
      }

      const bubble = document.createElement('div');
      bubble.className = `bubble ${role === 'user' ? 'user' : 'pet'}`;
      if (options.streaming) bubble.classList.add('streaming');
      bubble.textContent = text;

      if (role === 'user') {
        row.appendChild(bubble);
        row.appendChild(avatarIco);
      } else {
        row.appendChild(avatarIco);
        row.appendChild(bubble);
      }

      msgs.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function scrollToBottom() {
      msgs.scrollTop = msgs.scrollHeight;
    }

    async function send() {
      const msg = input.value.trim();
      if (!msg || isSending) return;

      input.value = '';
      setSending(true, '正在发送');
      addBubble('user', msg);
      const replyBubble = addBubble('pet', '', { streaming: true });

      let unlistenChunk = null;
      let unlistenDone = null;
      let finishedByEvent = false;

      try {
        const config = await invoke('load_llm_config', {});
        const hasApiKey = await invoke('has_llm_api_key', {});
        if (!hasApiKey) {
          replyBubble.classList.remove('streaming');
          replyBubble.textContent = '请先在设置里配置 API Key，我才能好好回复你。';
          setSending(false, '未配置 API Key');
          return;
        }

        const petStatus = await invoke('get_pet_status', {});
        const basePrompt = await invoke('build_persona_prompt', {
          customPrompt: null,
          mood: petStatus.mood || 'normal',
          hunger: petStatus.stats.hunger,
          happiness: petStatus.stats.happiness,
          isWorking: false,
        });
        const prompt = `你的名字叫「${petName}」。请保持可爱、亲近、有一点萝莉感的桌宠语气，但不要过度卖萌。\n${basePrompt}`;

        let fullText = '';
        unlistenChunk = await window.PetRuntime.listen('llm-stream-chunk', (e) => {
          fullText += e.payload || '';
          replyBubble.textContent = fullText;
          scrollToBottom();
        });
        unlistenDone = await window.PetRuntime.listen('llm-stream-done', (e) => {
          const final = e.payload || fullText;
          finishedByEvent = true;
          replyBubble.classList.remove('streaming');
          replyBubble.textContent = final || '嗯嗯，我听到了。';
          setSending(false, '已回复');
          if (final) window.PetRuntime.emit('chat-reply', final).catch(() => {});
          scrollToBottom();
        });

        const newHistory = await invoke('chat_stream', {
          message: msg,
          config,
          systemPrompt: prompt,
          history,
        });
        history = newHistory;

        if (!finishedByEvent && fullText) {
          replyBubble.classList.remove('streaming');
          replyBubble.textContent = fullText;
          setSending(false, '已回复');
          window.PetRuntime.emit('chat-reply', fullText).catch(() => {});
        }
      } catch (e) {
        const errMsg = typeof e === 'string' ? e : (e?.message || e?.toString() || JSON.stringify(e) || '未知错误');
        replyBubble.classList.remove('streaming');
        replyBubble.textContent = '请求失败：' + errMsg;
        setSending(false, '请求失败');
      } finally {
        setTimeout(() => {
          if (unlistenChunk) unlistenChunk();
          if (unlistenDone) unlistenDone();
        }, 300);
      }
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    window.addEventListener('resize', () => requestAnimationFrame(scrollToBottom));

    initChat();
  </script>
</body>
</html>
