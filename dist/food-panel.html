<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投喂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: "Microsoft YaHei", -apple-system, sans-serif;
      font-size: 13px;
      padding: 12px 16px 16px;
      overflow-y: auto;
      height: 100vh;
    }
    .header-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    h2 { font-size: 15px; color: #fff; }
    .wallet {
      font-size: 12px; color: #ffd700;
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.25);
      border-radius: 10px; padding: 3px 9px;
    }
    .wallet.low { color: #ff7b7b; border-color: rgba(255,100,100,0.3); background: rgba(255,80,80,0.08); }
    .group-title { font-size: 12px; color: #ffcf8a; margin: 10px 0 6px; font-weight: bold; }
    .item-btn {
      width: 100%; display: flex; flex-direction: column; align-items: stretch;
      padding: 8px; margin: 3px 0; border-radius: 6px; cursor: pointer;
      border: 0; background: rgba(255,255,255,0.055); color: #e8e8e8;
      text-align: left; font-family: inherit; font-size: 12px;
      transition: background 0.15s;
    }
    .item-btn:hover:not(.cannot-afford) { background: rgba(255,255,255,0.13); }
    .item-btn.cannot-afford {
      opacity: 0.55; cursor: not-allowed;
      background: rgba(255,255,255,0.025);
    }
    .item-name { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
    .item-name .name { font-weight: bold; }
    .item-name .price { color: #8be9fd; }
    .item-name .price.too-expensive { color: #ff7b7b; }
    .item-effects { font-size: 10px; color: #a9adb5; margin-top: 4px; line-height: 1.35; }
    .item-effects.cannot-afford { color: #ff9b9b; font-style: italic; }
    .empty { color: #aaa; font-size: 12px; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>
  <div class="header-row">
    <h2 id="panel-title">选择投喂项目</h2>
    <span class="wallet" id="wallet-display">💰 --</span>
  </div>
  <div id="food-list"></div>
  <div class="empty" id="empty-msg" style="display:none">没有可用项目</div>

  <script src="scripts/runtime.js"></script>
  <script>
    const { invoke } = window.PetRuntime;
    const listEl = document.getElementById('food-list');
    const emptyEl = document.getElementById('empty-msg');
    const walletEl = document.getElementById('wallet-display');
    const titleEl = document.getElementById('panel-title');
    let currentMoney = Infinity; // 加载前不限制

    function hideCurrentPanel() {
      const current = window.PetRuntime.currentWindow();
      if (current && typeof current.hide === 'function') {
        current.hide().catch(() => {});
      }
    }

    function updateWallet(money) {
      currentMoney = Number(money ?? Infinity);
      if (isFinite(currentMoney)) {
        walletEl.textContent = `💰 ${currentMoney.toFixed(0)} 金币`;
        walletEl.className = 'wallet' + (currentMoney < 20 ? ' low' : '');
      }
    }

    function effectsText(it) {
      const isMed = it.graph === 'medicine';
      const parts = [];
      if (isMed && it.health) {
        parts.push(`🩺 健康+${it.health.toFixed(0)}`);
      } else {
        if (it.strengthFood) parts.push(`饱腹${it.strengthFood > 0 ? '+' : ''}${it.strengthFood}`);
        if (it.strengthDrink) parts.push(`口渴${it.strengthDrink > 0 ? '+' : ''}${it.strengthDrink}`);
        if (it.strength) parts.push(`体力${it.strength > 0 ? '+' : ''}${it.strength}`);
        if (it.feeling) parts.push(`心情${it.feeling > 0 ? '+' : ''}${it.feeling}`);
        if (it.health) parts.push(`健康${it.health > 0 ? '+' : ''}${it.health}`);
        if (it.exp) parts.push(`经验${it.exp > 0 ? '+' : ''}${it.exp}`);
        if (it.likability) parts.push(`好感${it.likability > 0 ? '+' : ''}${it.likability}`);
      }
      return parts.join('  ') || '无属性变化';
    }

    async function init() {
      const shopMode = window.__shopMode === true;
      titleEl.textContent = shopMode ? '🛒 商店（购买入背包）' : '选择投喂项目';
      try {
        const filter = window.__foodFilter || null;
        listEl.innerHTML = '';
        emptyEl.style.display = 'none';

        const [data, status] = await Promise.all([
          invoke(shopMode ? 'get_shop_items' : 'get_food_menu', {}),
          invoke('get_pet_status', {}).catch(() => null),
        ]);

        updateWallet(status?.stats?.money ?? Infinity);

        const allItems = (data && data.items) ? data.items : [];
        const items = filter ? allItems.filter(it => it.graph === filter) : allItems;

        if (!items.length) { emptyEl.style.display = 'block'; return; }

        // 按食物类型分组
        const TYPE_LABELS = { meal: '正餐', snack: '零食', drink: '饮品', functional: '功能性', drug: '药品', gift: '礼物', tool: '道具' };
        const TYPE_ORDER = ['正餐', '零食', '饮品', '功能性', '药品', '礼物', '道具', '食物'];
        const groups = {};
        items.forEach(it => {
          const g = TYPE_LABELS[it.type]
            || (it.graph === 'gift' ? '礼物' : it.graph === 'medicine' ? '药品' : it.graph === 'drink' ? '饮品' : '食物');
          if (!groups[g]) groups[g] = [];
          groups[g].push(it);
        });

        const ordered = Object.entries(groups).sort((a, b) => {
          const ia = TYPE_ORDER.indexOf(a[0]); const ib = TYPE_ORDER.indexOf(b[0]);
          return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
        });
        ordered.forEach(([group, list]) => {
          const gt = document.createElement('div');
          gt.className = 'group-title';
          gt.textContent = group;
          listEl.appendChild(gt);

          list.forEach(it => {
            // 商店模式始终可点击购买; 投喂模式按金币是否充足
            const canAfford = shopMode ? true : currentMoney >= it.price;
            const btn = document.createElement('button');
            btn.className = 'item-btn' + (canAfford ? '' : ' cannot-afford');
            if (it.desc) btn.title = it.desc;

            const nameLine = document.createElement('div');
            nameLine.className = 'item-name';
            const nm = document.createElement('span');
            nm.className = 'name'; nm.textContent = it.name;
            const pr = document.createElement('span');
            pr.className = 'price' + (canAfford ? '' : ' too-expensive');
            pr.textContent = `¥${it.price}`;
            nameLine.appendChild(nm);
            nameLine.appendChild(pr);

            const eff = document.createElement('div');
            eff.className = 'item-effects' + (canAfford ? '' : ' cannot-afford');
            if (!canAfford) {
              eff.textContent = `金币不足（差 ${(it.price - currentMoney).toFixed(0)} 金币）`;
            } else {
              eff.textContent = effectsText(it);
            }

            btn.appendChild(nameLine);
            btn.appendChild(eff);

            if (shopMode) {
              btn.addEventListener('click', async () => {
                btn.disabled = true;
                try {
                  const r = await invoke('buy_item', { name: it.name, count: 1 });
                  if (r && r.stats) updateWallet(r.stats.money);
                  eff.textContent = r?.message || (r?.ok ? '已购买~' : '购买失败');
                  eff.className = 'item-effects' + (r?.ok ? '' : ' cannot-afford');
                  setTimeout(() => { eff.textContent = effectsText(it); eff.className = 'item-effects'; }, 1600);
                } catch (_) {
                  eff.textContent = '购买失败';
                } finally { btn.disabled = false; }
              });
            } else if (canAfford) {
              btn.addEventListener('click', () => {
                hideCurrentPanel();
                window.PetRuntime.emit('food-selected', { name: it.name, graph: it.graph }).catch(() => {});
              });
            }

            listEl.appendChild(btn);
          });
        });
      } catch (e) { emptyEl.textContent = '加载失败'; emptyEl.style.display = 'block'; }
    }

    init();
  </script>
</body>
</html>
